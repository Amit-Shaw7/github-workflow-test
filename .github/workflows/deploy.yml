name: CI/CD Pipeline to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Move into your project folder and pull latest code
            cd /home/ubuntu/your-project-directory
            git pull origin main

            # 2. Write your PORT secret into an .env file
            echo "PORT=${{ secrets.PORT }}" > .env

            # 3. Stop and delete the old container if it exists (prevents naming conflicts)
            docker stop node-app-container || true
            docker rm node-app-container || true

            # 4. Build a new image directly from your Dockerfile
            docker build -t node-app-image .

            # 5. Run the new container using your Dockerfile config
            docker run -d \
              --name node-app-container \
              --env-file .env \
              -p ${{ secrets.PORT }}:${{ secrets.PORT }} \
              --restart always \
              node-app-image

            # 6. Delete old, unused images to save EC2 disk space
            docker image prune -f
