name: CI/CD Pipeline to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Force the script to fail if the directory does not exist
            cd /home/ubuntu/your-project-directory || { echo "ERROR: Project directory not found!"; exit 1; }

            # 2. Print current location for debugging
            echo "Currently working in: $(pwd)"

            # 3. Pull latest changes
            git pull origin main

            # 4. Re-create the env file
            echo "PORT=${{ secrets.PORT }}" > .env

            # 5. Stop and remove old container
            sudo docker stop node-app-container || true
            sudo docker rm node-app-container || true

            # 6. Build the new image
            sudo docker build -t node-app-image .

            # 7. Run the new container
            sudo docker run -d \
              --name node-app-container \
              --env-file .env \
              -p ${{ secrets.PORT }}:${{ secrets.PORT }} \
              --restart always \
              node-app-image

            # 8. Verify running containers right inside the GitHub Actions logs
            echo "------ RUNNING CONTAINERS ON EC2 ------"
            sudo docker ps -a
