name: CI/CD Pipeline to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: SSH into EC2 and Deploy Docker Application
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Navigate to your project directory (change this path to match your actual EC2 setup)
            cd /home/ubuntu/your-project-directory

            # Pull the latest changes from Git
            git pull origin main

            # Update or create the .env file with your PORT variable
            echo "PORT=${{ secrets.PORT }}" > .env

            # Shut down existing containers to prevent conflicts
            docker-compose down

            # Rebuild images and start containers in detached mode
            docker-compose up -d --build

            # Clean up old, unused Docker images to save EC2 disk space
            docker image prune -f
