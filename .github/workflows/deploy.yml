name: CI/CD Pipeline to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        # 1. Map your GitHub Repository VARIABLE using the vars context
        env:
          PORT: ${{ vars.PORT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: PORT
          script: |
            echo "=== SERVER DETAILS ==="
            echo "Hostname: $(hostname)"

            echo "=== DIRECTORY CHECK ==="
            cd $HOME/github-workflow-test || { echo "Directory not found!"; exit 1; }

            git pull origin main

            # 2. Check if the variable is now visible
            echo "GitHub passed the variable port value: $PORT"

            echo "=== DOCKER BUILD ==="
            sudo docker build -t node-app-image .

            sudo docker stop node-app-container || true
            sudo docker rm node-app-container || true

            # 3. Use the Linux variable syntax to map the ports
            sudo docker run -d \
              --name node-app-container \
              -p $PORT:$PORT \
              --restart always \
              node-app-image

            echo "=== CONTAINER CHECK INSIDE GITHUB ==="
            sudo docker ps -a
