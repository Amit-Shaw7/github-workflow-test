name: CI/CD Pipeline to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Print the server hostname to verify which machine we are on
            echo "=== SERVER DETAILS ==="
            echo "Hostname: $(hostname)"
            echo "Public/Private IP info: $(hostname -I)"

            # 2. Check if the directory exists, print its contents
            echo "=== DIRECTORY CHECK ==="
            cd /home/ubuntu/your-project-directory || { echo "Directory not found!"; exit 1; }
            echo "Current Directory Path: $(pwd)"
            echo "Files in this directory:"
            ls -la

            # 3. Pull latest changes
            git pull origin main

            # 4. Build and Run
            echo "=== DOCKER BUILD ==="
            sudo docker build -t node-app-image .
            
            sudo docker stop node-app-container || true
            sudo docker rm node-app-container || true
            
            sudo docker run -d \
              --name node-app-container \
              -p ${{ secrets.PORT }}:${{ secrets.PORT }} \
              --restart always \
              node-app-image

            # 5. Print the container list immediately after starting
            echo "=== CONTAINER CHECK INSIDE GITHUB ==="
            sudo docker ps -a
